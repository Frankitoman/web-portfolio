name = "anoranza-gemini-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

# CORS: el sitio vive en más de un dominio a la vez (GitHub Pages y
# Cloudflare). Se puede poner una lista separada por comas, sin espacios
# extra ni barra al final:
#   ALLOWED_ORIGIN = "https://frankitoman.github.io,https://web-portfolio.francojmansilla.workers.dev"
# "*" permite cualquier origen (útil mientras se prueba); volver a correr
# `wrangler deploy` después de cambiar esto.
[vars]
ALLOWED_ORIGIN = "https://frankitoman.github.io,https://web-portfolio.francojmansilla.workers.dev"

# La clave de Gemini NO va acá (nunca a un archivo versionado).
# Se configura como secret con:
#   wrangler secret put GEMINI_API_KEY
