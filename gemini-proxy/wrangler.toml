name = "anoranza-gemini-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

# CORS: mientras el sitio no esté publicado, "*" permite probar desde
# cualquier origen (localhost incluido). Una vez publicado en GitHub Pages,
# reemplazar por el origen exacto (sin barra al final):
#   ALLOWED_ORIGIN = "https://frankitoman.github.io"
# y volver a correr `wrangler deploy`.
[vars]
ALLOWED_ORIGIN = "*"

# La clave de Gemini NO va acá (nunca a un archivo versionado).
# Se configura como secret con:
#   wrangler secret put GEMINI_API_KEY
