<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 4500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- one continuous light progression, dawn to night, for the whole descent -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#eef2f5"/>
      <stop offset="10%"  stop-color="#e3e9ee"/>
      <stop offset="20%"  stop-color="#cfe0ea"/>
      <stop offset="34%"  stop-color="#e3e9ee"/>
      <stop offset="47%"  stop-color="#f0d9c6"/>
      <stop offset="58%"  stop-color="#d9713c"/>
      <stop offset="66%"  stop-color="#cfd7de"/>
      <stop offset="77%"  stop-color="#8b97a3"/>
      <stop offset="87%"  stop-color="#5b6672"/>
      <stop offset="95%"  stop-color="#243039"/>
      <stop offset="100%" stop-color="#12171d"/>
    </linearGradient>
    <radialGradient id="warmglow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d9713c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d9713c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="4500" fill="url(#sky)"/>

  <!-- ============================================================ -->
  <!-- ZONE A · Cresta (~0-900) — the tallest peak, echoing the mark -->
  <!-- ============================================================ -->
  <!-- Ridges pulled taller (peaks moved further up) so the establishing shot
       at scroll=0 — which, given the total scroll weight, only ever shows
       roughly the top 425 of these 900 units — reads as mountains, not sky. -->
  <polygon points="0,410 180,270 340,350 520,210 700,320 880,190 1060,310 1240,230 1420,320 1600,260 1600,900 0,900" fill="#cfd7de" opacity="0.9"/>
  <polygon points="0,490 220,370 420,450 620,320 820,440 1020,330 1220,450 1420,360 1600,430 1600,900 0,900" fill="#b7c2cc"/>
  <polygon points="0,610 260,510 420,550 560,390 700,510 760,450 820,510 980,410 1180,550 1360,490 1600,570 1600,900 0,900" fill="#8b97a3"/>
  <!-- the tallest peak, echoing the mark — enlarged so it dominates the load
       frame, apex at x=800 (the viewBox's own horizontal centre, which is
       what xMidYMid slice centres on screen regardless of viewport width). -->
  <polygon points="800,100 650,590 950,590" fill="#8b97a3"/>
  <!-- Ember cap base at the exact edge-intersection points (t=0.44 along
       each side from the apex), not eyeballed — a mismatch here reads as a
       sliver of the peak's own colour showing past the orange tip. -->
  <polygon points="800,100 866,316 734,316" fill="#d9713c" opacity="0.85"/>
  <polygon points="0,900 0,820 300,780 620,830 900,790 1200,830 1600,800 1600,900" fill="#1c232b"/>

  <!-- ============================================================ -->
  <!-- ZONE B · Valle (~900-1800) — four small houses, lit windows   -->
  <!-- ============================================================ -->
  <polygon points="0,1320 260,1220 520,1300 780,1200 1040,1300 1300,1220 1600,1280 1600,1800 0,1800" fill="#cfd7de" opacity="0.7"/>
  <polygon points="0,1420 300,1330 600,1400 900,1320 1200,1400 1600,1350 1600,1800 0,1800" fill="#b7c2cc" opacity="0.7"/>
  <polygon points="0,1540 400,1500 800,1550 1200,1500 1600,1540 1600,1800 0,1800" fill="#8b97a3" opacity="0.55"/>
  <polygon points="0,1800 0,1620 400,1590 800,1630 1200,1590 1600,1620 1600,1800" fill="#1c232b"/>
  <g>
    <polygon points="160,1590 200,1550 240,1590 240,1620 160,1620" fill="#5b6672"/>
    <rect x="192" y="1578" width="16" height="16" fill="#d9713c"/>
  </g>
  <g>
    <polygon points="460,1600 496,1562 532,1600 532,1630 460,1630" fill="#5b6672"/>
    <rect x="486" y="1586" width="20" height="18" fill="#d9713c" opacity="0.9"/>
  </g>
  <g>
    <polygon points="860,1595 898,1556 936,1595 936,1626 860,1626" fill="#5b6672"/>
    <rect x="888" y="1582" width="20" height="18" fill="#d9713c" opacity="0.9"/>
  </g>
  <g>
    <polygon points="1160,1605 1194,1568 1228,1605 1228,1633 1160,1633" fill="#5b6672"/>
    <rect x="1184" y="1592" width="18" height="16" fill="#d9713c" opacity="0.9"/>
  </g>

  <!-- ============================================================ -->
  <!-- ZONE C · Ladera (~1800-2700) — EL PICO: the alpenglow house   -->
  <!-- ============================================================ -->
  <polygon points="0,2040 300,1960 620,2020 900,1900 1220,2040 1600,1940 1600,2700 0,2700" fill="url(#warmglow)" opacity="0.4"/>
  <polygon points="0,2160 320,2080 640,2150 960,2040 1280,2160 1600,2070 1600,2700 0,2700" fill="#a85630" opacity="0.75"/>
  <polygon points="220,2300 320,2220 420,2300 420,2420 220,2420" fill="#1c232b"/>
  <polygon points="220,2300 320,2220 320,2300" fill="#eef2f5" opacity="0.92"/>
  <polygon points="320,2220 420,2300 320,2300" fill="#f0d9c6" opacity="0.85"/>
  <rect x="255" y="2330" width="60" height="60" fill="#d9713c"/>
  <rect x="350" y="2330" width="42" height="60" fill="#d9713c" opacity="0.9"/>
  <polygon points="0,2700 0,2560 300,2520 640,2570 960,2520 1600,2560 1600,2700" fill="#1c232b"/>

  <!-- ============================================================ -->
  <!-- ZONE D · Bifurcación (~2700-3600) — the trail splits          -->
  <!-- ============================================================ -->
  <polygon points="0,2980 300,2900 620,2970 940,2880 1260,2960 1600,2900 1600,3600 0,3600" fill="#5b6672" opacity="0.6"/>
  <polygon points="0,3600 0,3300 1600,3300 1600,3600" fill="#1c232b"/>
  <!-- A slim flagpole, not the old 24-wide post: at the old width, the pole
       stuck out past the pennants' own narrow tip near the top instead of
       staying hidden behind them. -->
  <rect x="796" y="3132" width="8" height="168" fill="#1c232b"/>
  <!-- Proper pennant proportions (width roughly 2x height, not the ~3:1 span
       the old rectangles had) so these actually read as small flags rather
       than long banners. -->
  <polygon points="800,3138 705,3163 800,3188" fill="#8b97a3"/>
  <polygon points="800,3138 895,3163 800,3188" fill="#d9713c"/>
  <text x="755" y="3170" font-family="'Space Mono', monospace" font-size="16" fill="#1c232b" text-anchor="middle">A</text>
  <text x="845" y="3170" font-family="'Space Mono', monospace" font-size="16" fill="#eef2f5" text-anchor="middle">B</text>

  <!-- ============================================================ -->
  <!-- ZONE E · Ventana (~3600-4500) — arrival, one lit doorway      -->
  <!-- ============================================================ -->
  <polygon points="0,3860 400,3780 800,3840 1200,3760 1600,3800 1600,4500 0,4500" fill="#4f9d8a" opacity="0.14"/>
  <polygon points="0,4120 300,4040 620,4100 940,4020 1260,4100 1600,4040 1600,4500 0,4500" fill="#12171d"/>
  <!-- Shifted down ~198 (138 + another 60 of margin) so the house sits
       clear of the top edge of the visible slice, not just its centre —
       a real-device iPhone check (WebKit + iPhone 13 profile, 390x664, a
       shorter viewport than the 844 this had been tuned against) showed
       the roofline grazing the top with the original 138 offset. Visible
       range = last 4500/(total+1) viewBox units — recompute if the leg
       weights change. -->
  <polygon points="680,4318 800,4218 920,4318 920,4478 680,4478" fill="#0f1319"/>
  <polygon points="680,4318 800,4218 800,4318" fill="#1c232b"/>
  <rect x="760" y="4358" width="80" height="120" fill="url(#warmglow)"/>
  <rect x="772" y="4370" width="56" height="96" fill="#d9713c"/>
  <rect x="712" y="4358" width="30" height="30" fill="#d9713c" opacity="0.8"/>
  <rect x="860" y="4358" width="30" height="30" fill="#d9713c" opacity="0.8"/>

  <!-- ============================================================ -->
  <!-- foreground rock, near-silhouette (Cresta's own trail start)   -->
  <!-- ============================================================ -->
  <polygon points="0,900 0,620 200,560 340,640 260,900" fill="#1c232b"/>

  <!-- ============================================================ -->
  <!-- ONE continuous trail, quiet at the top, clear by the arrival  -->
  <!-- ============================================================ -->
  <path d="
    M 120 900 C 260 830, 340 810, 460 800
    C 520 850, 560 900, 580 1000
    C 610 1150, 540 1350, 500 1490
    C 620 1560, 780 1610, 900 1620
    C 780 1680, 620 1720, 560 1800
    C 500 1900, 480 2000, 500 2100
    C 460 2180, 380 2220, 400 2280
    C 500 2350, 650 2500, 780 2620
    C 850 2680, 800 2800, 780 2950
    C 770 3050, 785 3120, 800 3160
    L 800 3300
    C 900 3260, 1040 3230, 1180 3210
    M 800 3300 C 700 3260, 560 3230, 420 3210
    C 700 3400, 820 3600, 800 3750
    C 785 3870, 810 3960, 800 4020
  " fill="none" stroke="#eef2f5" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.7"/>
</svg>
