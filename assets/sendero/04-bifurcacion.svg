<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe0ea"/>
      <stop offset="60%" stop-color="#8b97a3"/>
      <stop offset="100%" stop-color="#5b6672"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky4)"/>

  <!-- distant ridge fading into dusk -->
  <polygon points="0,480 300,400 620,470 940,380 1260,460 1600,410 1600,900 0,900" fill="#5b6672" opacity="0.6"/>
  <polygon points="0,900 0,600 1600,600 1600,900" fill="#1c232b"/>

  <!-- the trail splits into two -->
  <path d="M 800 900 L 800 660" fill="none" stroke="#eef2f5" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.75"/>
  <path d="M 800 660 C 700 600, 560 560, 420 540" fill="none" stroke="#eef2f5" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.6"/>
  <path d="M 800 660 C 900 600, 1040 560, 1180 540" fill="none" stroke="#eef2f5" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round" opacity="0.6"/>

  <!-- the signpost -->
  <rect x="788" y="560" width="24" height="140" fill="#1c232b"/>
  <polygon points="620,560 800,540 800,590 620,610" fill="#8b97a3"/>
  <polygon points="800,540 980,560 980,610 800,590" fill="#d9713c"/>
  <text x="710" y="583" font-family="'Space Mono', monospace" font-size="18" fill="#1c232b" text-anchor="middle">A</text>
  <text x="890" y="583" font-family="'Space Mono', monospace" font-size="18" fill="#eef2f5" text-anchor="middle">B</text>
</svg>
