name = "anoranza-gemini-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

# CORS: mientras no tengan el dominio final de Cloudflare Pages, "*" permite
# probar desde cualquier origen (localhost incluido). En cuanto tengan el
# dominio definitivo, reemplacen por ese origen exacto (sin barra al final,
# ej: "https://anoranza.pages.dev") y vuelvan a correr `wrangler deploy`.
[vars]
ALLOWED_ORIGIN = "*"

# La clave de Gemini NO va acá (nunca a un archivo versionado).
# Se configura como secret con:
#   wrangler secret put GEMINI_API_KEY
